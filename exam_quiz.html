<title>期中期末大考 - 智慧學習樂園</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>

  .setup-section { background: #f5f5f5; padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 2px solid #673ab7; }
  .question-box { background-color: #ede7f6; padding: 30px; border-radius: 20px; margin-bottom: 25px; font-size: 2.2rem; font-weight: bold; color: #311b92; border: 4px solid #9575cd; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .option-btn { background-color: #ffffff; border: 3px solid #d1c4e9; border-radius: 15px; padding: 20px; font-size: 1.6rem; cursor: pointer; transition: all 0.2s; font-weight: bold; }
  .option-btn:hover { background-color: #f3e5f5; transform: scale(1.02); }
  .option-btn.correct { background-color: #c8e6c9 !important; border-color: #4caf50; }
  .option-btn.wrong { background-color: #ffcdd2 !important; border-color: #f44336; }
  .info-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #5e35b1; font-size: 1.1rem; }
  .btn { color: white; border: none; padding: 15px 25px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .btn-subject { background-color: #673ab7; margin: 5px; width: 120px; }
  .btn-subject.active { background-color: #ff9800; transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .btn-primary { background-color: #ff9800; width: 100%; margin-top: 15px; }
  .btn-home { background-color: #00bcd4; width: 100%; margin-top: 10px; }
  .stats-card { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; }
  /* 連續答對動畫樣式 */
  .streak-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 2000;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.95);
    padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center; opacity: 0;
  }
  .streak-overlay.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .streak-pikmin { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce 0.8s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
  .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }

<div class="quiz-container">
  <h1 id="main-title">🏆 期中末全方位大考 🏆</h1>
  
  <div id="portal-ui">

      <button class="btn btn-subject" id="btn-math" onclick="setSubject('MATH')">數學</button>

      <button class="btn btn-primary" onclick="startExam('medium')" style="background-color: #ff9800;">🟡 進階挑戰 (20題)</button>
      <button class="btn btn-primary" onclick="startExam('hard')" style="background-color: #f44336;">🔴 模擬大考 (40題)</button>
    </div>
    <button class="btn btn-home" onclick="location.href='index.html'">🏠 返回學習大廳</button>
  </div>

  <div id="quiz-ui" style="display:none">
    <div class="info-bar">
      <span id="progress-text"></span>

    </div>
    <div class="question-box" id="question-text"></div>
    <div class="options-grid" id="options-container"></div>
    <div style="display: flex; gap: 10px;">

      <button class="btn btn-primary" id="next-btn" style="visibility:hidden; flex: 2;" onclick="loadNext()">下一題 ➔</button>
    </div>
  </div>

  <div id="result-ui" style="display:none">

    <div class="stats-card" id="result-summary"></div>
    <button class="btn btn-primary" onclick="location.reload()">再考一次</button>

    <div id="stats-container" style="max-height: 250px; overflow-y: auto; margin-top: 20px;"></div>
  </div>
</div>

  (function autoFillBank() {
    const sampleWords = [
        ["要", "襾"], ["靜", "青"], ["空", "穴"], ["雲", "雨"], ["水", "水"], ["蟲", "虫"], ["草", "艸"], ["先", "儿"], 
        ["完", "宀"], ["再", "冂"], ["聽", "耳"], ["沒", "水"], ["著", "艸"], ["輕", "車"], ["快", "心"], ["歌", "欠"],
        ["聞", "耳"], ["香", "香"], ["樂", "木"], ["會", "曰"], ["短", "矢"], ["過", "辵"], ["後", "彳"], ["吃", "口"],
        ["菜", "艸"], ["桌", "木"], ["鞋", "革"], ["回", "囗"], ["家", "宀"], ["爸", "父"], ["靠", "非"], ["見", "見"],
        ["船", "舟"], ["暖", "日"], ["需", "雨"], ["放", "攴"], ["話", "言"], ["跟", "足"], ["班", "玉"], ["弟", "弓"],
        ["拿", "手"], ["給", "糸"], ["寫", "宀"], ["喜", "口"], ["都", "邑"], ["夢", "夕"], ["變", "言"], ["黑", "黑"],
        ["漂", "水"], ["戲", "戈"], ["魚", "魚"], ["國", "囗"], ["樹", "木"], ["認", "言"], ["風", "風"], ["學", "子"]
    ];
    
    sampleWords.forEach(w => {
        CHINESE_EXAM_BANK.push({
            q: `「${w[0]}」的部首是？`,
            a: w[1],
            opts: shuffle([w[1], "木", "口", "人"])
        });
    });

    const strokeWords = [
        ["一", "1"], ["二", "2"], ["三", "3"], ["大", "3"], ["上", "3"], ["下", "3"], ["口", "3"], ["土", "3"], 
        ["不", "4"], ["中", "4"], ["五", "4"], ["六", "4"], ["木", "4"], ["火", "4"], ["水", "4"], ["月", "4"],
        ["生", "5"], ["以", "5"], ["用", "5"], ["他", "5"], ["去", "5"], ["外", "5"], ["好", "6"], ["多", "6"],
        ["我", "7"], ["你", "7"], ["的", "8"], ["和", "8"], ["是", "9"], ["為", "9"], ["國", "11"], ["學", "16"]
    ];

    strokeWords.forEach(w => {
        CHINESE_EXAM_BANK.push({
            q: `「${w[0]}」總共有幾畫？`,
            a: w[1],
            opts: shuffle([w[1], (parseInt(w[1])+1).toString(), (parseInt(w[1])-1).toString(), (parseInt(w[1])+2).toString()])
        });
    });
  })();

  function saveStats() { localStorage.setItem('examStats', JSON.stringify(examStats)); }

  function setSubject(s) {
    currentSubject = s;
    document.getElementById('btn-zh').classList.toggle('active', s === 'ZH');
    document.getElementById('btn-math').classList.toggle('active', s === 'MATH');
  }

  function startExam(diff) {
    streakCounter = 0;
    restReminderShown = false;
    examData = generateExamData(currentSubject, diff);
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    currentIdx = 0; score = 0;
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    renderQuestion();
  }

  function showStreakAnimation() {
    const anim = document.getElementById('streak-animation');
    const pikminIcon = anim.querySelector('.streak-pikmin i');
    const colors = ['#ff5252', '#448aff', '#ffd740', '#9c27b0', '#4caf50'];
    pikminIcon.style.color = colors[Math.floor(Math.random() * colors.length)];
    anim.classList.add('show');
    setTimeout(() => {
      anim.classList.remove('show');
    }, 2000);
  }

  function updateTimer() {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timer-display').textContent = `⏱️ ${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;

    if (sec >= 1200 && !restReminderShown) {
      restReminderShown = true;
      alert("小朋友，你已經練習 20 分鐘囉！休息一下眼睛吧！");
    }
  }

  function generateExamData(sub, diff) {
    let pool = [];
    const count = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 40;
    
    if (sub === 'MATH') {
      const range = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 100;
      let expressions = new Set();
      while(pool.length < 250) {
        let a = Math.floor(Math.random() * range) + 1;
        let b = Math.floor(Math.random() * range) + 1;
        let op = Math.random() > 0.5 ? '+' : '-';
        if (op === '-' && a < b) [a, b] = [b, a];
        
        let expr = `${a} ${op} ${b}`;
        if (!expressions.has(expr)) {
            expressions.add(expr);
            let ans = op === '+' ? a + b : a - b;
            
            let optionsSet = new Set([ans.toString()]);
            while (optionsSet.size < 4) {
                let offset = Math.floor(Math.random() * 9) - 4; // -4 to 4
                let fake = ans + offset;
                if (fake >= 0 && fake !== ans) optionsSet.add(fake.toString());
            }
            pool.push({ q: `${expr} = ?`, a: ans.toString(), opts: shuffle(Array.from(optionsSet)) });
        }
      }
    } else {
      // 確保國語題庫中的每個題目選項都經過隨機打亂
      pool = CHINESE_EXAM_BANK.map(item => ({
        ...item,
        opts: shuffle([...item.opts])
      }));
    }
    return shuffle(pool).slice(0, Math.min(count, pool.length));
  }

  function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

  function renderQuestion() {
    const data = examData[currentIdx];
    document.getElementById('progress-text').textContent = `第 ${currentIdx + 1} / ${examData.length} 題`;
    document.getElementById('question-text').innerHTML = addZhuyin(data.q);
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('next-btn').style.visibility = 'hidden';

    data.opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = addZhuyin(opt);
      btn.dataset.value = opt; // 儲存原始值
      btn.onclick = () => {
        if (document.getElementById('next-btn').style.visibility === 'visible') return;
        if (!examStats[data.q]) examStats[data.q] = { correct: 0, wrong: 0 };
        
        if (opt.toString() === data.a.toString()) {
          btn.classList.add('correct');
          btn.innerHTML = addZhuyin(opt, "#2e7d32");
          streakCounter++;
          score++;
          examStats[data.q].correct++;
          if (streakCounter > 0 && streakCounter % 3 === 0) showStreakAnimation();
        } else {
          streakCounter = 0;
          btn.classList.add('wrong');
          Array.from(container.children).forEach(b => {
            if(b.dataset.value.toString() === data.a.toString()) {
              b.classList.add('correct');
              b.innerHTML = addZhuyin(data.a, "#2e7d32");
            }
          });
          examStats[data.q].wrong++;
        }
        saveStats();
        document.getElementById('next-btn').style.visibility = 'visible';
      };
      container.appendChild(btn);
    });
  }

  function loadNext() {
    currentIdx++;
    if (currentIdx < examData.length) renderQuestion();
    else finishExam();
  }

  function finishExam() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'block';
    
    const accuracy = Math.round((score / examData.length) * 100);
    document.getElementById('result-summary').innerHTML = `
      <p style="font-size: 1.5rem; color: #673ab7;">科目：<b>${currentSubject === 'ZH' ? '國語' : '數學'}</b></p>
      <p>🎯 答對題數：<b>${score} / ${examData.length}</b></p>
      <p>📈 正確率：<b style="color: ${accuracy >= 80 ? '#4caf50' : '#f44336'}">${accuracy}%</b></p>
      <p>⏱️ 總耗時：<b>${Math.floor(elapsed/60)}分${elapsed%60}秒</b></p>
    `;
    renderStatsTable();
  }

  function renderStatsTable() {
    const statsContainer = document.getElementById('stats-container');
    let html = `<h3>📊 測驗題庫表現</h3><table class="stats-table"><tr><th>題目</th><th>對/錯</th></tr>`;
    Object.keys(examStats).slice(0, 30).forEach(key => {
      const d = examStats[key];
      html += `<tr>
        <td style="text-align:left">${key}</td>
        <td>${d.correct} / <span style="color:red">${d.wrong}</span></td>
      </tr>`;
    });
    html += `</table>`;
    statsContainer.innerHTML = html;
  }
</script>
