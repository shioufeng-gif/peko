<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期中期末大考 - 智慧學習樂園</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', 'Microsoft JhengHei'; background: linear-gradient(135deg, #f3e5f5 0%, #e8eaf6 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
  .quiz-container { background: #ffffff; padding: clamp(20px, 5vw, 40px); border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 700px; width: 100%; text-align: center; }
  .setup-section { background: #f5f5f5; padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 2px solid #673ab7; }
  .question-box { background-color: #ede7f6; padding: 30px; border-radius: 20px; margin-bottom: 25px; font-size: 2.2rem; font-weight: bold; color: #311b92; border: 4px solid #9575cd; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .option-btn { background-color: #ffffff; border: 3px solid #d1c4e9; border-radius: 15px; padding: 20px; font-size: 1.6rem; cursor: pointer; transition: all 0.2s; font-weight: bold; }
  .option-btn:hover { background-color: #f3e5f5; transform: scale(1.02); }
  .option-btn.correct { background-color: #c8e6c9 !important; border-color: #4caf50; }
  .option-btn.wrong { background-color: #ffcdd2 !important; border-color: #f44336; }
  .info-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #5e35b1; font-size: 1.1rem; }
  .btn { color: white; border: none; padding: 15px 25px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .btn-subject { background-color: #673ab7; margin: 5px; width: 120px; }
  .btn-subject.active { background-color: #ff9800; transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .btn-primary { background-color: #ff9800; width: 100%; margin-top: 15px; }
  .btn-home { background-color: #00bcd4; width: 100%; margin-top: 10px; }
  .stats-card { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1 id="main-title">🏆 期中末全方位大考 🏆</h1>
  
  <div id="portal-ui">
    <div class="setup-section">
      <p style="font-weight: bold; font-size: 1.3rem;">1. 選擇考試科目</p>
      <button class="btn btn-subject active" id="btn-zh" onclick="setSubject('ZH')">國語</button>
      <button class="btn btn-subject" id="btn-math" onclick="setSubject('MATH')">數學</button>
      
      <p style="font-weight: bold; font-size: 1.3rem; margin-top: 20px;">2. 選擇難度級別</p>
      <button class="btn btn-primary" onclick="startExam('easy')" style="background-color: #4caf50;">🟢 基礎練習 (10題)</button>
      <button class="btn btn-primary" onclick="startExam('medium')" style="background-color: #ff9800;">🟡 進階挑戰 (20題)</button>
      <button class="btn btn-primary" onclick="startExam('hard')" style="background-color: #f44336;">🔴 模擬大考 (40題)</button>
    </div>
    <button class="btn btn-home" onclick="location.href='index.html'">🏠 返回學習大廳</button>
  </div>

  <div id="quiz-ui" style="display:none">
    <div class="info-bar">
      <span id="progress-text"></span>
      <span id="timer-display">⏱️ 00:00</span>
    </div>
    <div class="question-box" id="question-text"></div>
    <div class="options-grid" id="options-container"></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-home" onclick="location.href='index.html'" style="flex: 1;">🏠 放棄</button>
      <button class="btn btn-primary" id="next-btn" style="visibility:hidden; flex: 2;" onclick="loadNext()">下一題 ➔</button>
    </div>
  </div>

  <div id="result-ui" style="display:none">
    <h2>📊 考試成績單</h2>
    <div class="stats-card" id="result-summary"></div>
    <button class="btn btn-primary" onclick="location.reload()">再考一次</button>
    <button class="btn btn-home" onclick="location.href='index.html'">返回大廳</button>
  </div>
</div>

<script>
  let currentSubject = 'ZH';
  let examData = [];
  let currentIdx = 0;
  let score = 0;
  let startTime, timerInterval;

  function setSubject(s) {
    currentSubject = s;
    document.getElementById('btn-zh').classList.toggle('active', s === 'ZH');
    document.getElementById('btn-math').classList.toggle('active', s === 'MATH');
  }

  function startExam(diff) {
    examData = generateExamData(currentSubject, diff);
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    currentIdx = 0; score = 0;
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    renderQuestion();
  }

  function updateTimer() {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timer-display').textContent = `⏱️ ${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
  }

  function generateExamData(sub, diff) {
    let pool = [];
    const count = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 40;
    
    if (sub === 'MATH') {
      const range = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 100;
      for(let i=0; i<100; i++) {
        let a = Math.floor(Math.random() * range) + 1;
        let b = Math.floor(Math.random() * range) + 1;
        let op = Math.random() > 0.5 ? '+' : '-';
        if (op === '-' && a < b) [a, b] = [b, a];
        let ans = op === '+' ? a + b : a - b;
        pool.push({ q: `${a} ${op} ${b} = ?`, a: ans.toString(), opts: shuffle([ans, ans+1, ans-1, Math.abs(ans-2)]) });
      }
    } else {
      // 國語模擬題庫 (整合部首、筆畫、注音)
      const zhData = [
        { q: "「天」的部首是？", a: "大", opts: ["大", "一", "人", "二"] },
        { q: "「學」總共有幾畫？", a: "16", opts: ["16", "14", "15", "17"] },
        { q: "「馬」的正確注音？", a: "ㄇㄚˇ", opts: ["ㄇㄚˇ", "ㄇㄚ", "ㄇㄚˋ", "ㄇㄚˊ"] },
        { q: "「花」的部首是？", a: "艸", opts: ["艸", "木", "化", "土"] },
        { q: "「一」隻「」鳥？", a: "隻", opts: ["隻", "個", "條", "本"] }
      ];
      // 擴充虛擬題庫
      for(let i=0; i<50; i++) pool.push(...zhData);
    }
    return shuffle(pool).slice(0, count);
  }

  function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

  function renderQuestion() {
    const data = examData[currentIdx];
    document.getElementById('progress-text').textContent = `第 ${currentIdx + 1} / ${examData.length} 題`;
    document.getElementById('question-text').textContent = data.q;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('next-btn').style.visibility = 'hidden';

    data.opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        if (document.getElementById('next-btn').style.visibility === 'visible') return;
        if (opt.toString() === data.a.toString()) {
          btn.classList.add('correct');
          score++;
        } else {
          btn.classList.add('wrong');
          // 顯示正確答案
          Array.from(container.children).forEach(b => {
            if(b.textContent === data.a.toString()) b.classList.add('correct');
          });
        }
        document.getElementById('next-btn').style.visibility = 'visible';
      };
      container.appendChild(btn);
    });
  }

  function loadNext() {
    currentIdx++;
    if (currentIdx < examData.length) renderQuestion();
    else finishExam();
  }

  function finishExam() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'block';
    
    const accuracy = Math.round((score / examData.length) * 100);
    document.getElementById('result-summary').innerHTML = `
      <p style="font-size: 1.5rem; color: #673ab7;">科目：<b>${currentSubject === 'ZH' ? '國語' : '數學'}</b></p>
      <p>🎯 答對題數：<b>${score} / ${examData.length}</b></p>
      <p>📈 正確率：<b style="color: ${accuracy >= 80 ? '#4caf50' : '#f44336'}">${accuracy}%</b></p>
      <p>⏱️ 總耗時：<b>${Math.floor(elapsed/60)}分${elapsed%60}秒</b></p>
    `;
  }
</script>
</body>
</html>
