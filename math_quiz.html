<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年級數學大測驗</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', 'Microsoft JhengHei'; background: linear-gradient(135deg, #fff9c4 0%, #e1f5fe 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
  .quiz-container { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
  .setup-section { background: #e8f5e9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
  .question-box { background-color: #fff9c4; padding: 25px; border-radius: 15px; margin-bottom: 20px; font-size: 2.5rem; font-weight: bold; border: 3px dashed #ffb300; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .option-btn { background-color: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; font-size: 1.8rem; cursor: pointer; transition: all 0.2s; font-weight: bold; }
  .option-btn.correct { background-color: #c8e6c9; border-color: #4caf50; }
  .option-btn.wrong { background-color: #ffcdd2; border-color: #f44336; }
  .info-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #555; }
  .btn { color: white; border: none; padding: 15px; font-size: 1.2rem; border-radius: 25px; cursor: pointer; font-weight: bold; }
  .btn-primary { background-color: #ff9800; }
  .btn-secondary { background-color: #9e9e9e; }
  .btn-home { background-color: #00bcd4; margin-top: 10px; }
  /* 連續答對動畫樣式 */
  .streak-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 2000;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    opacity: 0;
  }
  .streak-overlay.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .streak-pikmin { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce 0.8s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .feedback { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
  .feedback.show-correct { display: block; background-color: #e8f5e9; color: #2e7d32; }
  .feedback.show-wrong { display: block; background-color: #ffebee; color: #c62828; }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>🔢 一年級數學大測驗 🔢</h1>
  <div id="portal-ui">
    <p style="font-weight: bold; font-size: 1.2rem;">請選擇難度級別</p>
    <button class="btn btn-primary" onclick="initQuiz('easy')" style="width: 80%; background-color: #4caf50; margin-bottom: 10px;">🟢 簡易 (10題 / 10以內)</button>
    <button class="btn btn-primary" onclick="initQuiz('medium')" style="width: 80%; background-color: #ff9800; margin-bottom: 10px;">🟡 中等 (20題 / 20以內)</button>
    <button class="btn btn-primary" onclick="initQuiz('hard')" style="width: 80%; background-color: #f44336; margin-bottom: 10px;">🔴 困難 (50題 / 100以內)</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 80%;">返回大廳</button>
  </div>

  <div id="quiz-ui" style="display:none">
    <div class="info-bar">
      <span id="progress"></span>
      <span id="timer-display">⏱️ 00:00</span>
    </div>
    <div class="question-box" id="question-text"></div>
    <div class="options-grid" id="options-container"></div>
    <div class="feedback" id="feedback-box"></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-home" onclick="location.href='index.html'" style="flex: 1;">🏠 首頁</button>
      <button class="btn btn-primary" id="next-btn" style="visibility:hidden; flex: 2;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>

  <div id="result-ui" style="display:none">
    <h2>測驗完成！</h2>
    <div id="result-summary" style="font-size: 1.2rem; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;"></div>
    <button class="btn btn-primary" onclick="location.reload()" style="width: 100%;">再測一次</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 100%;">返回大廳</button>
    <div id="stats-container" style="max-height: 250px; overflow-y: auto; margin-top: 20px;"></div>
  </div>
</div>

<!-- 連續答對 3 題的動畫彈窗 -->
<div id="streak-animation" class="streak-overlay">
  <div class="streak-pikmin"><i class="fas fa-seedling"></i></div>
  <div style="font-size: 1.5rem; font-weight: bold; color: #00796b;">太棒了！<br>連續答對 3 題！</div>
  <div style="font-size: 1.2rem; margin-top: 10px; color: #ff9800;">🌟 皮克敏為你加油 🌟</div>
</div>

<script>
  let data = [];
  // 生成 200 題數學 (加減法 1-100)
  function generateData(difficulty) {
    let pool = [];
    let count = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 20 : 50;
    let maxRange = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 20 : 100;

    for(let i=0; i<200; i++) {
      let a = Math.floor(Math.random() * maxRange) + 1;
      let b = Math.floor(Math.random() * maxRange) + 1;
      let op = Math.random() > 0.5 ? '+' : '-';
      if(op === '-' && a < b) [a, b] = [b, a];
      let ans = op === '+' ? a + b : a - b;
      let w1 = ans + (Math.random() > 0.5 ? 1 : -1);
      let w2 = ans + (Math.random() > 0.5 ? 2 : -2);
      let w3 = Math.abs(ans - 10);
      pool.push([`${a} ${op} ${b} = ?`, ans.toString(), w1.toString(), w2.toString(), w3.toString()]);
    }
    return pool.sort(() => Math.random() - 0.5).slice(0, count);
  }

  let quizData = [];
  let currentIdx = 0;
  let score = 0;
  let startTime, timerInterval;
  let streakCounter = 0;
  let missedQuestions = [];
  let restReminderShown = false;
  let userStats = JSON.parse(localStorage.getItem('mathStats')) || {};
  function saveStats() { localStorage.setItem('mathStats', JSON.stringify(userStats)); }

  function speakEncouragement(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = text === 'good job' ? 'en-US' : 'zh-TW';
    window.speechSynthesis.speak(utterance);
  }

  function showStreakAnimation() {
    const anim = document.getElementById('streak-animation');
    const pikminIcon = anim.querySelector('.streak-pikmin i');
    const colors = ['#ff5252', '#448aff', '#ffd740', '#9c27b0', '#4caf50'];
    pikminIcon.style.color = colors[Math.floor(Math.random() * colors.length)];
    anim.classList.add('show');
    setTimeout(() => {
      anim.classList.remove('show');
    }, 2000);
  }

  function initQuiz(difficulty) {
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    restReminderShown = false;
    streakCounter = 0;
    missedQuestions = [];
    quizData = generateData(difficulty);
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function retryMissed() {
    quizData = [...missedQuestions].sort(() => Math.random() - 0.5);
    missedQuestions = [];
    streakCounter = 0;
    score = 0;
    currentIdx = 0;
    restReminderShown = false;
    document.getElementById('result-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function updateTimer() {
    let elapsed = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    let s = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').textContent = `⏱️ ${m}:${s}`;

    if (elapsed >= 1200 && !restReminderShown) {
      restReminderShown = true;
      alert("小朋友，你已經練習 20 分鐘囉！休息一下眼睛吧！");
    }
  }

  function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById('question-text').textContent = q[0];
    document.getElementById('progress').textContent = `進度: ${currentIdx + 1} / ${quizData.length}`;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.visibility = 'hidden';

    let opts = [q[1], q[2], q[3], q[4]].sort(() => Math.random() - 0.5);
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        if (document.getElementById('next-btn').style.visibility === 'visible') return;
        if (!userStats[q[0]]) userStats[q[0]] = { correct: 0, wrong: 0 };

        if (opt === q[1]) {
          btn.classList.add('correct');
          streakCounter++;
          score++;
          userStats[q[0]].correct++;
          document.getElementById('feedback-box').textContent = "⭕ 答對了！你好棒！";
          document.getElementById('feedback-box').className = "feedback show-correct";
          if (score === 3) speakEncouragement("你很棒");
          else if (score === 5) speakEncouragement("做的好");
          if (streakCounter > 0 && streakCounter % 3 === 0) showStreakAnimation();
        } else {
          streakCounter = 0;
          missedQuestions.push(q);
          btn.classList.add('wrong');
          userStats[q[0]].wrong++;
          document.getElementById('feedback-box').textContent = `❌ 答錯了，答案是 ${q[1]}`;
          document.getElementById('feedback-box').className = "feedback show-wrong";
        }
        saveStats();
        document.getElementById('next-btn').style.visibility = 'visible';
      };
      container.appendChild(btn);
    });
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) loadQuestion();
    else {
      clearInterval(timerInterval);
      if (score === quizData.length && quizData.length > 0) speakEncouragement("good job");
      let elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('quiz-ui').style.display = 'none';
      document.getElementById('result-ui').style.display = 'block';
      document.getElementById('result-summary').innerHTML = `
        <p>🎯 得分：<b>${score} / ${quizData.length}</b></p>
        <p>⏱️ 總時間：<b>${Math.floor(elapsed/60)}分${elapsed%60}秒</b></p>
        <p>📈 正確率：<b>${Math.round(score/quizData.length*100)}%</b></p>
      `;
    }
  }
</script>
</body>
</html>
