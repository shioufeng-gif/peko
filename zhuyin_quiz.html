<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注音練習大挑戰 - 智慧學習樂園</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', 'Microsoft JhengHei'; background: linear-gradient(135deg, #fce4ec 0%, #e1f5fe 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
  .quiz-container { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
  .setup-section { background: #fff3e0; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #ff9800; }
  .question-box { background-color: #f3e5f5; padding: 25px; border-radius: 15px; margin-bottom: 20px; font-size: 2.8rem; font-weight: bold; color: #4a148c; border: 3px dashed #9c27b0; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .option-btn { background-color: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; font-size: 1.8rem; cursor: pointer; transition: all 0.2s; font-weight: bold; }
  .option-btn.correct { background-color: #c8e6c9; border-color: #4caf50; }
  .option-btn.wrong { background-color: #ffcdd2; border-color: #f44336; }
  .info-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #555; }
  .btn { color: white; border: none; padding: 15px; font-size: 1.2rem; border-radius: 25px; cursor: pointer; font-weight: bold; }
  .btn-primary { background-color: #f44336; }
  .btn-home { background-color: #00bcd4; margin-top: 10px; }
  /* 連續答對動畫樣式 */
  .streak-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 2000;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    opacity: 0;
  }
  .streak-overlay.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .streak-pikmin { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce 0.8s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
  .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
  .feedback { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
  .feedback.show-correct { display: block; background-color: #e8f5e9; color: #2e7d32; }
  .feedback.show-wrong { display: block; background-color: #ffebee; color: #c62828; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>🎈 注音練習大挑戰 🎈</h1>
  <div id="portal-ui">
    <p style="font-weight: bold; font-size: 1.2rem;">請選擇練習等級</p>
    <button class="btn btn-primary" onclick="initQuiz('easy')" style="width: 80%; background-color: #4caf50; margin-bottom: 10px;">🟢 簡易 (10題 / 認讀符號)</button>
    <button class="btn btn-primary" onclick="initQuiz('medium')" style="width: 80%; background-color: #ff9800; margin-bottom: 10px;">🟡 中等 (20題 / 基礎詞彙)</button>
    <button class="btn btn-primary" onclick="initQuiz('hard')" style="width: 80%; background-color: #f44336; margin-bottom: 10px;">🔴 困難 (50題 / 進階挑戰)</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 80%;">🏠 返回學習大廳</button>
  </div>

  <div id="quiz-ui" style="display:none">
    <div class="info-bar">
      <span id="progress"></span>
      <span id="timer-display">⏱️ 00:00</span>
    </div>
    <div class="question-box" id="question-text"></div>
    <div class="options-grid" id="options-container"></div>
    <div class="feedback" id="feedback-box"></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-home" onclick="location.href='index.html'" style="flex: 1;">🏠 首頁</button>
      <button class="btn btn-primary" id="next-btn" style="visibility:hidden; flex: 2;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>

  <div id="result-ui" style="display:none">
    <h2>🏆 練習結束囉！</h2>
    <div id="result-summary" style="font-size: 1.2rem; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;"></div>
    <button class="btn btn-primary" onclick="location.reload()" style="width: 100%;">再試一次</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 100%;">返回大廳</button>
    <div id="stats-container" style="max-height: 250px; overflow-y: auto; margin-top: 20px;"></div>
  </div>
</div>

<!-- 連續答對 3 題的動畫彈窗 -->
<div id="streak-animation" class="streak-overlay">
  <div class="streak-pikmin"><i class="fas fa-seedling"></i></div>
  <div style="font-size: 1.5rem; font-weight: bold; color: #00796b;">太棒了！<br>連續答對 3 題！</div>
  <div style="font-size: 1.2rem; margin-top: 10px; color: #f44336;">🌟 皮克敏為你加油 🌟</div>
</div>

<script>
  const zhuyinData = {
    easy: [
      ["一", "ㄧ", "ㄧˋ", "ㄧˊ", "ㄧˇ"], ["人", "ㄖㄣˊ", "ㄖㄣ", "ㄖㄣˇ", "ㄖㄣˋ"], 
      ["上", "ㄕㄤˋ", "ㄕㄤ", "ㄕㄤˇ", "ㄙㄤˋ"], ["下", "ㄒㄧㄚˋ", "ㄒㄧㄚ", "ㄒㄧㄚˇ", "ㄒㄧㄚˊ"],
      ["大", "ㄉㄚˋ", "ㄉㄚˇ", "ㄉㄚ", "ㄉㄚˊ"], ["小", "ㄒㄧㄠˇ", "ㄒㄧㄠ", "ㄒㄧㄠˋ", "ㄒㄧㄠˊ"],
      ["口", "ㄎㄡˇ", "ㄎㄡ", "ㄎㄡˋ", "ㄎㄡˊ"], ["山", "ㄕㄢ", "ㄕㄢˇ", "ㄕㄢˋ", "ㄙㄢ"],
      ["手", "ㄕㄡˇ", "ㄕㄡ", "ㄕㄡˋ", "ㄙㄡˇ"], ["天", "ㄊㄧㄢ", "ㄉㄧㄢ", "ㄊㄧㄢˇ", "ㄊㄧㄢˋ"]
    ],
    medium: [
      ["大", "ㄉㄚˋ", "ㄉㄚˇ", "ㄉㄚ", "ㄉㄚˊ"], ["小", "ㄒㄧㄠˇ", "ㄒㄧㄠ", "ㄒㄧㄠˋ", "ㄒㄧㄠˊ"], 
      ["山", "ㄕㄢ", "ㄕㄢˋ", "ㄙㄢ", "ㄙㄢˇ"], ["水", "ㄕㄨㄟˇ", "ㄙㄨㄟˇ", "ㄕㄨㄟˋ", "ㄕㄨㄟ"],
      ["人", "ㄖㄣˊ", "ㄖㄣ", "ㄖㄣˇ", "ㄖㄣˋ"], ["口", "ㄎㄡˇ", "ㄎㄡ", "ㄎㄡˋ", "ㄎㄡˊ"],
      ["日", "ㄖˋ", "ㄖˊ", "ㄖ", "ㄖˇ"], ["月", "ㄩㄝˋ", "ㄩㄝ", "ㄧㄝˋ", "ㄧㄝ"],
      ["爸", "ㄅㄚˋ", "ㄅㄚ", "ㄆㄚˋ", "ㄆㄚ"], ["媽", "ㄇㄚ", "ㄇㄚˇ", "ㄋㄚ", "ㄋㄚˇ"],
      ["老師", "ㄌㄠˇ ㄕ", "ㄌㄠˇ ㄙ", "ㄋㄠˇ ㄕ", "ㄌㄠ ㄕ"], ["同學", "ㄊㄨㄥˊ ㄒㄩㄝˊ", "ㄉㄨㄥˊ ㄒㄩㄝˊ", "ㄊㄨㄥ ㄒㄩㄝ", "ㄉㄨㄥ ㄒㄩㄝ"],
      ["一", "ㄧ", "ㄧˋ", "ㄧˊ", "ㄧˇ"], ["二", "ㄦˋ", "ㄦˊ", "ㄦ", "ㄦˇ"],
      ["三", "ㄙㄢ", "ㄕㄢ", "ㄙㄢˇ", "ㄙㄢˋ"], ["四", "ㄙˋ", "ㄕˋ", "ㄙˇ", "ㄕˇ"],
      ["五", "ㄨˇ", "ㄨ", "ㄨˋ", "ㄨˊ"], ["六", "ㄌㄧㄡˋ", "ㄋㄧㄡˋ", "ㄌㄧㄡˇ", "ㄋㄧㄡˇ"]
    ],
    hard: [
      ["學校", "ㄒㄩㄝˊ ㄒㄧㄠˋ", "ㄒㄩㄝ ㄒㄧㄠ", "ㄒㄧㄝˊ ㄒㄧㄠˋ", "ㄒㄩㄝˊ ㄒㄧㄠ"],
      ["漂亮", "ㄆㄧㄠˋ ㄌㄧㄤˋ", "ㄅㄧㄠˋ ㄌㄧㄤˋ", "ㄆㄧㄠˇ ㄌㄧㄤˇ", "ㄆㄧㄠ ㄌㄧㄤ"],
      ["朋友", "ㄆㄥˊ ㄧㄡˇ", "ㄅㄥˊ ㄧㄡˇ", "ㄆㄥ ㄧㄡ", "ㄅㄥ ㄧㄡ"],
      ["高興", "ㄍㄠ ㄒㄧㄥˋ", "ㄍㄠ ㄒㄧㄣ", "ㄎㄠ ㄒㄧㄥˋ", "ㄎㄠ ㄒㄧㄣ"],
      ["西瓜", "ㄒㄧ ㄍㄨㄚ", "ㄒㄧ ㄍㄨㄚˇ", "ㄒㄧ ㄍㄨㄚˋ", "ㄒㄧ ㄍㄨㄚˊ"],
      ["蘋果", "ㄆㄧㄥˊ ㄍㄨㄛˇ", "ㄅㄧㄥˊ ㄍㄨㄛˇ", "ㄆㄧㄥ ㄍㄨㄛ", "ㄅㄧㄥ ㄍㄨㄛ"],
      ["香蕉", "ㄒㄧㄤ ㄐㄧㄠ", "ㄒㄧㄤˇ ㄐㄧㄠˇ", "ㄒㄧㄤ ㄑㄧㄠ", "ㄒㄧㄤˇ ㄑㄧㄠˇ"],
      ["葡萄", "ㄆㄨˊ ㄊㄠˊ", "ㄅㄨˊ ㄉㄠˊ", "ㄆㄨ ㄊㄠ", "ㄅㄨ ㄉㄠ"],
      ["衣服", "ㄧ ㄈㄨˊ", "ㄧ ㄈㄨ", "ㄧˋ ㄈㄨˊ", "ㄧˋ ㄈㄨ"],
      ["鞋子", "ㄒㄧㄝˊ ㄗ˙", "ㄒㄧㄝ ㄗ", "ㄒㄧㄝˇ ㄗˇ", "ㄒㄧㄝˋ ㄗˋ"],
      ["眼睛", "ㄧㄢˇ ㄐㄧㄥ", "ㄧㄢ ㄐㄧㄥ", "ㄧㄢˇ ㄑㄧㄥ", "ㄧㄢ ㄑㄧㄥ"]
    ]
  };

  let quizData = [];
  let currentIdx = 0;
  let score = 0;
  let startTime, timerInterval;
  let streakCounter = 0;
  let missedQuestions = [];
  let restReminderShown = false;
  let userStats = JSON.parse(localStorage.getItem('zhuyinStats')) || {};
  function saveStats() { localStorage.setItem('zhuyinStats', JSON.stringify(userStats)); }

  function speakEncouragement(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = text === 'good job' ? 'en-US' : 'zh-TW';
    window.speechSynthesis.speak(utterance);
  }

  function showStreakAnimation() {
    const anim = document.getElementById('streak-animation');
    const pikminIcon = anim.querySelector('.streak-pikmin i');
    const colors = ['#ff5252', '#448aff', '#ffd740', '#9c27b0', '#4caf50'];
    pikminIcon.style.color = colors[Math.floor(Math.random() * colors.length)];
    anim.classList.add('show');
    setTimeout(() => {
      anim.classList.remove('show');
    }, 2000);
  }

  function initQuiz(difficulty) {
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    restReminderShown = false;
    streakCounter = 0;
    missedQuestions = [];
    
    let sourcePool = zhuyinData[difficulty];
    let count = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 20 : 50;

    quizData = [...sourcePool].sort(() => Math.random() - 0.5).slice(0, count);
    
    if (quizData.length < count) {
       while (quizData.length < count) {
         quizData.push(...sourcePool);
       }
       quizData = quizData.sort(() => Math.random() - 0.5).slice(0, count);
    }

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function retryMissed() {
    quizData = [...missedQuestions].sort(() => Math.random() - 0.5);
    missedQuestions = [];
    streakCounter = 0;
    score = 0;
    currentIdx = 0;
    restReminderShown = false;
    document.getElementById('result-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function updateTimer() {
    let elapsed = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    let s = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').textContent = `⏱️ ${m}:${s}`;

    if (elapsed >= 1200 && !restReminderShown) {
      restReminderShown = true;
      alert("小朋友，你已經練習 20 分鐘囉！休息一下眼睛吧！");
    }
  }

  function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById('question-text').textContent = q[0];
    document.getElementById('progress').textContent = `進度: ${currentIdx + 1} / ${quizData.length}`;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.visibility = 'hidden';

    let opts = [q[1], q[2], q[3], q[4]].sort(() => Math.random() - 0.5);
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        if (document.getElementById('next-btn').style.visibility === 'visible') return;
        if (!userStats[q[0]]) userStats[q[0]] = { correct: 0, wrong: 0 };
        
        if (opt === q[1]) {
          btn.classList.add('correct');
          streakCounter++;
          score++;
          document.getElementById('feedback-box').textContent = "⭕ 太棒了！答對了！";
          document.getElementById('feedback-box').className = "feedback show-correct";
          userStats[q[0]].correct++;
          if (score === 3) speakEncouragement("你很棒");
          else if (score === 5) speakEncouragement("做的好");
          if (streakCounter > 0 && streakCounter % 3 === 0) showStreakAnimation();
        } else {
          streakCounter = 0;
          missedQuestions.push(q);
          btn.classList.add('wrong');
          document.getElementById('feedback-box').textContent = `❌ 哎呀，答案是 ${q[1]}`;
          document.getElementById('feedback-box').className = "feedback show-wrong";
          userStats[q[0]].wrong++;
        }
        saveStats();
        document.getElementById('next-btn').style.visibility = 'visible';
      };
      container.appendChild(btn);
    });
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    clearInterval(timerInterval);
    let elapsed = Math.floor((Date.now() - startTime) / 1000);
    if (score === quizData.length && quizData.length > 0) speakEncouragement("good job");
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'block';
    
    let accuracy = Math.round((score / quizData.length) * 100);
    document.getElementById('result-summary').innerHTML = `
      <p>🎯 答對題數：<b>${score} / ${quizData.length}</b></p>
      <p>⏱️ 總共花費：<b>${Math.floor(elapsed/60)}分${elapsed%60}秒</b></p>
      <p>📈 正確率：<b>${accuracy}%</b></p>
    `;

    if (missedQuestions.length > 0) {
      document.getElementById('result-summary').innerHTML += `
        <button class="btn btn-primary" onclick="retryMissed()" style="background-color: #f44336; margin-top: 15px; width: 100%; box-shadow: 0 6px 0 #b71c1c;">🎯 挑戰錯題特訓 (${missedQuestions.length}題)</button>
      `;
    }
    renderStatsTable();
  }

  function renderStatsTable() {
    const statsContainer = document.getElementById('stats-container');
    let html = `<h3>📊 學習統計 (錯誤率排序)</h3><table class="stats-table"><tr><th>題目</th><th>對/錯</th><th>正確率</th></tr>`;
    
    const sorted = Object.keys(userStats).sort((a, b) => {
      const rateA = userStats[a].wrong / (userStats[a].correct + userStats[a].wrong || 1);
      const rateB = userStats[b].wrong / (userStats[b].correct + userStats[b].wrong || 1);
      return rateB - rateA;
    });

    sorted.forEach(key => {
      const d = userStats[key];
      const total = d.correct + d.wrong;
      const acc = Math.round((d.correct / total) * 100);
      html += `<tr>
        <td style="font-size:1.1rem; font-weight:bold;">${key}</td>
        <td>${d.correct} / <span style="color:red">${d.wrong}</span></td>
        <td>${acc}%</td>
      </tr>`;
    });
    html += `</table>`;
    statsContainer.innerHTML = html;
  }
</script>
</body>
</html>
