<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5fbf4">
<title>康軒版二年級上學期生活科練習</title>
<style>
  * { box-sizing: border-box; }
  body {
    display: grid;
    min-height: 100vh;
    margin: 0;
    padding: 22px 14px;
    place-items: center;
    color: #34413b;
    background: linear-gradient(140deg, #f3fae8, #e5f6f7);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .quiz-container {
    width: min(100%, 760px);
    padding: clamp(20px, 5vw, 40px);
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 16px 45px rgba(49, 87, 67, .13);
  }
  .home-link {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 999px;
    background: #00bcd4;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    color: white;
    font-size: .95rem;
    font-weight: 750;
    text-decoration: none;
  }
  .home-link:hover { background: #0097a7; }
  .home-link:focus-visible { outline: 3px solid #006064; outline-offset: 3px; }
  h1 { margin: 0; color: #286c59; font-size: clamp(1.7rem, 5vw, 2.4rem); }
  .intro { color: #68776e; line-height: 1.7; }
  .setup, .question-card, .result-card {
    margin-top: 20px;
    padding: clamp(18px, 4vw, 28px);
    border: 2px solid #d9edda;
    border-radius: 20px;
    background: #f8fcf6;
  }
  label { display: block; margin: 16px 0 7px; font-weight: 750; }
  select, .btn {
    width: 100%;
    min-height: 48px;
    padding: 11px 14px;
    border: 2px solid #cfe3d0;
    border-radius: 12px;
    background: white;
    color: #34413b;
    font: inherit;
    font-size: 1rem;
  }
  select:focus-visible, .btn:focus-visible, input:focus-visible, .option:focus-visible {
    outline: 3px solid #388e6a;
    outline-offset: 3px;
  }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
  .toggle-row label { display: inline; margin: 0; }
  .toggle-row input { width: 20px; height: 20px; accent-color: #318265; }
  .btn {
    border: 0;
    background: #318265;
    color: white;
    cursor: pointer;
    font-weight: 800;
  }
  .btn:hover { background: #256b53; }
  .btn-secondary { margin-top: 10px; background: #e8f2e8; color: #286c59; }
  .btn-secondary:hover { background: #d8ead8; }
  .info-bar { display: flex; justify-content: space-between; gap: 12px; color: #52675a; font-weight: 750; }
  .question-card { border-color: #cbe8dc; background: #f4fbf7; }
  .unit-label { margin: 0 0 12px; color: #318265; font-weight: 800; }
  .question { margin: 0; color: #263d32; font-size: clamp(1.35rem, 4vw, 1.8rem); line-height: 1.65; }
  .annotated-char {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }
  .reading {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-left: .08em;
    color: #7a5a9c;
    font-size: .46em;
    font-weight: 500;
    line-height: 1;
  }
  .reading-core {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: .9;
  }
  .phonetic-symbol, .reading-tone {
    writing-mode: vertical-rl;
    text-orientation: upright;
  }
  .reading-tone:not(.neutral-tone) {
    align-self: center;
    margin-left: .12em;
  }
  .reading-tone.neutral-tone {
    position: absolute;
    top: -.55em;
    left: 50%;
    transform: translateX(-50%);
  }
  .reading[hidden] { display: none; }
  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  .option {
    min-height: 76px;
    padding: 12px;
    border: 2px solid #d5e5d7;
    border-radius: 14px;
    background: white;
    color: #34413b;
    cursor: pointer;
    font: inherit;
    font-size: 1.12rem;
    font-weight: 750;
    line-height: 1.5;
  }
  .option:hover:not(:disabled) { border-color: #70ad83; background: #f3faf2; }
  .option.correct { border-color: #48a36a; background: #e1f4e5; }
  .option.wrong { border-color: #d96b6b; background: #ffebeb; }
  .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 800; }
  .feedback.good { color: #287c49; }
  .feedback.bad { color: #bd4848; }
  .score { color: #286c59; font-size: 1.35rem; font-weight: 850; }
  @media (max-width: 520px) {
    .options { grid-template-columns: 1fr; }
    .info-bar { font-size: .9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main class="quiz-container">
  <a class="home-link" href="learning.html">🏠 返回大廳</a>
  <h1>🌱 康軒版二年級上學期生活科</h1>
  <p class="intro">依常見單元主題整理原創練習題，每單元有選擇題和是非題。不同學年度的單元編排可能調整，請以課本為準。可開啟注音輔助讀題。</p>

  <section id="setup" class="setup" aria-label="測驗設定">
    <label for="unit-select">選擇單元</label>
    <select id="unit-select">
      <option value="all">全部單元</option>
    </select>
    <label for="type-select">選擇題型</label>
    <select id="type-select">
      <option value="all">混合題（選擇＋是非）</option>
      <option value="choice">選擇題</option>
      <option value="trueFalse">是非題</option>
    </select>
    <div class="toggle-row">
      <input id="zhuyin-toggle" type="checkbox" checked>
      <label for="zhuyin-toggle">顯示注音輔助</label>
    </div>
    <button class="btn" id="start-btn" type="button">開始練習</button>
  </section>

  <section id="quiz" hidden aria-live="polite">
    <div class="info-bar">
      <span id="progress"></span>
      <span id="score"></span>
    </div>
    <div class="question-card">
      <p class="unit-label" id="unit-label"></p>
      <p class="question" id="question"></p>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn" id="next-btn" type="button" hidden>下一題 →</button>
    </div>
    <button class="btn btn-secondary" id="quit-btn" type="button">返回測驗設定</button>
  </section>

  <section id="result" class="result-card" hidden aria-live="polite">
    <h2>練習完成！</h2>
    <p class="score" id="result-score"></p>
    <p id="result-message"></p>
    <button class="btn" id="restart-btn" type="button">再練一次</button>
    <button class="btn btn-secondary" id="result-setup-btn" type="button">選擇其他單元</button>
  </section>
</main>

    const selectedUnits = unitSelect.value === "all" ? units : [units[Number(unitSelect.value)]];
    const selectedType = typeSelect.value;
    questions = selectedUnits.flatMap(unit => unit.questions
      .filter(question => selectedType === "all" || question.type === selectedType)
      .map(question => {
        const preparedQuestion = { ...question, unit: unit.title };
        if (question.type !== "choice") return preparedQuestion;

        const shuffledOptions = shuffle(question.options.map((option, originalIndex) => ({
          option,
          originalIndex
        })));
        return {
          ...preparedQuestion,
          options: shuffledOptions.map(entry => entry.option),
          answer: shuffledOptions.findIndex(entry => entry.originalIndex === question.answer)
        };
      }));
    if (questions.length === 0) return;
    questionIndex = 0;
    correctCount = 0;
    setup.hidden = true;
    result.hidden = true;
    quiz.hidden = false;
    renderQuestion();
  }

  function renderQuestion() {
    const item = questions[questionIndex];
    answered = false;
    document.getElementById("progress").textContent = `第 ${questionIndex + 1} / ${questions.length} 題`;
    document.getElementById("score").textContent = `答對 ${correctCount} 題`;
    document.getElementById("unit-label").textContent = item.unit;
    renderAnnotatedText(document.getElementById("question"), item.q, item.z);
    const optionsContainer = document.getElementById("options");
    optionsContainer.replaceChildren();
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("next-btn").hidden = true;

    const options = item.type === "choice"
      ? item.options.map(([text, z], index) => ({ text, z, value: index }))
      : [{ text: "是", z: "ㄕˋ", value: true }, { text: "不是", z: "ㄅㄨˊ ㄕˋ", value: false }];
    options.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.dataset.value = String(option.value);
      renderAnnotatedText(button, option.text, option.z);
      button.addEventListener("click", () => selectAnswer(button, option.value, item));
      optionsContainer.appendChild(button);
    });
  }

  function renderAnnotatedText(container, text, reading) {
    container.replaceChildren();
    const syllables = reading
      .replace(/[，。！？；：、,.!?;:]/g, " ")
      .split(/\s+/)
      .filter(Boolean);
    let syllableIndex = 0;

    Array.from(text).forEach(character => {
      if (!/\p{Script=Han}/u.test(character)) {
        container.appendChild(document.createTextNode(character));
        return;
      }

      const annotatedCharacter = document.createElement("span");
      annotatedCharacter.className = "annotated-char";
      annotatedCharacter.appendChild(document.createTextNode(character));
      const pronunciation = document.createElement("span");
      pronunciation.className = "reading";
      const syllable = syllables[syllableIndex++] || "";
      const tone = syllable.match(/[˙ˊˇˋ]$/)?.[0] || "";
      const phoneticSymbols = tone ? syllable.slice(0, -tone.length) : syllable;
      const phoneticCore = document.createElement("span");
      phoneticCore.className = "reading-core";
      Array.from(phoneticSymbols).forEach(symbol => {
        const phoneticSymbol = document.createElement("span");
        phoneticSymbol.className = "phonetic-symbol";
        phoneticSymbol.textContent = symbol;
        phoneticCore.appendChild(phoneticSymbol);
      });
      pronunciation.appendChild(phoneticCore);
      if (tone) {
        const toneMark = document.createElement("span");
        toneMark.className = `reading-tone${tone === "˙" ? " neutral-tone" : ""}`;
        toneMark.textContent = tone;
        pronunciation.appendChild(toneMark);
      }
      pronunciation.hidden = !zhuyinToggle.checked;
      annotatedCharacter.appendChild(pronunciation);
      container.appendChild(annotatedCharacter);
    });
  }

  function selectAnswer(button, value, item) {
    if (answered) return;
    answered = true;
    const isCorrect = value === item.answer;
    if (isCorrect) correctCount++;
    document.querySelectorAll(".option").forEach(option => {
      option.disabled = true;
      if (option.dataset.value === String(item.answer)) option.classList.add("correct");
    });
    if (!isCorrect) button.classList.add("wrong");
    const feedback = document.getElementById("feedback");
    feedback.textContent = isCorrect ? "答對了，真棒！" : `再記一次，正確答案是「${item.type === "choice" ? item.options[item.answer][0] : item.answer ? "是" : "不是"}」。`;
    feedback.classList.add(isCorrect ? "good" : "bad");
    document.getElementById("score").textContent = `答對 ${correctCount} 題`;
    const nextButton = document.getElementById("next-btn");
    nextButton.textContent = questionIndex + 1 === questions.length ? "看練習結果" : "下一題 →";
    nextButton.hidden = false;
  }

  function showResult() {
    quiz.hidden = true;
    result.hidden = false;
    document.getElementById("result-score").textContent = `答對 ${correctCount} / ${questions.length} 題`;
    document.getElementById("result-message").textContent = correctCount === questions.length
      ? "太厲害了！全部答對！"
      : "做得很好，看看錯題再練習一次吧！";
  }

  function returnToSetup() {
    quiz.hidden = true;
    result.hidden = true;
    setup.hidden = false;
  }

  function shuffle(items) {
    const shuffled = [...items];
    for (let index = shuffled.length - 1; index > 0; index--) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
    }
    return shuffled;
  }

  document.getElementById("start-btn").addEventListener("click", startQuiz);
  document.getElementById("next-btn").addEventListener("click", () => {
    questionIndex++;
    if (questionIndex < questions.length) renderQuestion();
    else showResult();
  });
  document.getElementById("quit-btn").addEventListener("click", returnToSetup);
  document.getElementById("restart-btn").addEventListener("click", startQuiz);
  document.getElementById("result-setup-btn").addEventListener("click", returnToSetup);
  zhuyinToggle.addEventListener("change", () => {
    document.querySelectorAll(".reading").forEach(pronunciation => {
      pronunciation.hidden = !zhuyinToggle.checked;
    });
  });
</script>
</body>
</html>
