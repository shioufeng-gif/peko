<html lang="zh-TW">

<title>部首大挑戰 Pro - 智慧學習版</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';

    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    box-sizing: border-box;
  }
  .quiz-container {
    background: #ffffff;
    padding: clamp(15px, 4vw, 30px);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #00796b;
    font-size: clamp(1.5rem, 5vw, 2rem);
    margin-bottom: 20px;
  }
  .setup-section {
    background: #e8f5e9;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
  }
  .setup-section select {
    padding: 10px;
    font-size: clamp(1rem, 3vw, 1.2rem);
    border-radius: 8px;
    border: 1px solid #ccc;
    margin: 10px 0;
    width: 90%;
    max-width: 300px;
  }
  
  /* 頂部資訊列 (進度與計時) */
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    color: #555;
    font-size: clamp(0.9rem, 3vw, 1.1rem);
    font-weight: bold;
    padding: 0 10px;
  }

  /* 題目框 */
  .question-box {
    background-color: #fff9c4;
    padding: clamp(15px, 4vw, 25px);
    border-radius: 15px;
    margin-bottom: 20px;
    font-size: clamp(1.4rem, 6vw, 2.2rem); /* 自動調整字體大小 */
    font-weight: bold;
    color: #333;
    border: 3px dashed #ffb300;
  }
  
  /* 選項網格 */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(10px, 3vw, 15px);
    margin-bottom: 20px;
  }
  .option-btn {
    background-color: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: clamp(10px, 2.5vw, 15px);
    font-size: clamp(1.2rem, 5vw, 1.8rem); /* 自動調整字體大小 */
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    color: #424242;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
  }
  .zhuyin-text {
    font-size: clamp(0.7rem, 2.5vw, 0.9rem);
    color: #00796b;
    margin-top: 4px;
    font-weight: normal;
  }
  .option-btn:hover:not(:disabled) {
    background-color: #e3f2fd;
    border-color: #64b5f6;
    transform: scale(1.02);
  }
  .option-btn.correct {
    background-color: #c8e6c9;
    border-color: #4caf50;
    color: #2e7d32;
  }
  .option-btn.wrong {
    background-color: #ffcdd2;
    border-color: #f44336;
    color: #c62828;
  }
  .option-btn:disabled {
    cursor: default;
  }

  /* 回饋訊息框 */
  .feedback {
    min-height: 60px;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    display: none;
    line-height: 1.5;
  }
  .feedback.show-correct {
    display: block;
    background-color: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }
  .feedback.show-wrong {
    display: block;
    background-color: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn {
    flex: 1;
    min-width: 100px;
    color: white;
    border: none;
    padding: clamp(10px, 3vw, 15px);
    font-size: clamp(1rem, 3vw, 1.2rem);
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);

  .btn-primary { background-color: #ff9800; }
  .btn-secondary { background-color: #9e9e9e; }
  .btn-home { background-color: #00bcd4; }

  .stats-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
  }
  .stats-table th, .stats-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  .stats-table th { background: #f5f5f5; color: #333; }
  .stats-table tr:nth-child(even) { background-color: #fafafa; }
  .high-error { color: #d32f2f; font-weight: bold; }
  .perfect { color: #2e7d32; font-weight: bold; }
  
  /* 入口網頁樣式 */
  .portal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .portal-card {
    background: #ffffff;
    border: 2px solid #00bcd4;
    border-radius: 15px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .portal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    background-color: #e0f7fa;
  }
  .portal-card i { font-size: 3rem; margin-bottom: 10px; }
  .portal-card h3 { margin: 10px 0; color: #00796b; }
  .disabled-card {
    opacity: 0.6;
    cursor: not-allowed;
    border-color: #ccc;
  }

  @media (max-width: 400px) {
    .options-grid { grid-template-columns: 1fr; }
    .nav-buttons { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>

    gainNode.connect(audioCtx.destination);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);

      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.3);

    "革": "ㄍㄜˊ", "圭": "ㄍㄨㄟ", "回": "ㄏㄨㄟˊ", "家": "ㄐㄧㄚ", "豕": "ㄕˇ", "把": "ㄅㄚˇ", "手(扌)": "ㄕㄡˇ", "巴": "ㄅㄚ",
    "肉(月)": "ㄖㄡˋ", "爸": "ㄅㄚˋ", "非": "ㄈㄟ", "見": "ㄐㄧㄢˋ", "舟": "ㄓㄡ", "享": "ㄒㄧㄤˇ", "受": "ㄕㄡˋ", "爪": "ㄓㄠˇ",
    "溫": "ㄨㄣ", "暖": "ㄋㄨㄢˇ", "乍": "ㄓㄚˋ", "做": "ㄗㄨㄛˋ", "它": "ㄊㄚ", "匕": "ㄅㄧˇ", "才": "ㄘㄞˊ", "需": "ㄒㄩ",
    "而": "ㄦˊ", "方": "ㄈㄤ", "易": "ㄧˋ", "光": "ㄍㄨㄤ", "攴(攵)": "ㄆㄨ", "完": "ㄨㄢˊ", "八": "ㄅㄚ", "言": "ㄧㄢˊ",
    "跟": "ㄍㄣ", "足": "ㄗㄨˊ", "艮": "ㄍㄣˇ", "班": "ㄅㄢ", "玉(王)": "ㄩˋ", "床": "ㄔㄨㄤˊ", "广": "ㄧㄢˇ", "弟": "ㄉㄧˋ",
    "酉": "ㄧㄡˇ", "卜": "ㄅㄨˇ", "片": "ㄆㄧㄢˋ", "糸": "ㄇㄧˋ", "喜": "ㄒㄧˇ", "吉": "ㄐㄧˊ", "歡": "ㄏㄨㄢ", "都": "ㄉㄡ", "您": "ㄋㄧㄣˊ"
  };

  function saveStats() { localStorage.setItem('radicalQuizStats', JSON.stringify(userStats)); }

  function getErrorRate(char) {
    if (!userStats[char]) return 0.5;
    const total = userStats[char].correct + userStats[char].wrong;
    if (total === 0) return 0.5;
    return userStats[char].wrong / total;
  }

  function shuffleArray(array) {
    let newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    startTime = Date.now();
    timerInterval = setInterval(() => {
      totalSecondsElapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('timer-display').textContent = `⏱️ ${formatTime(totalSecondsElapsed)}`;
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
  }

  // 入口網頁選擇類別
  function selectCategory(category) {
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('setup-ui').style.display = 'block';
    if (category === 'grade1-lower-1-6') {
      document.getElementById('category-title').textContent = '📚 國小一下 (1~6課)';
    }
  }

  // 返回首頁邏輯
  function goHome() {
    stopTimer();
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'none';
    document.getElementById('setup-ui').style.display = 'none';
    document.getElementById('portal-ui').style.display = 'block';
  }

  function initQuiz() {
    const selectBox = document.getElementById('question-count-select');
    totalQuestions = selectBox.value === 'all' ? rawWordData.length : parseInt(selectBox.value);

    let sortedData = [...rawWordData].sort((a, b) => {
      let rateA = getErrorRate(a[0]);
      let rateB = getErrorRate(b[0]);
      return (rateB - rateA) + (Math.random() * 0.4 - 0.2); 
    });

    const selectedWords = sortedData.slice(0, totalQuestions);
    
    quizData = selectedWords.map(item => {
      const char = item[0];
      const correctRadical = item[2];
      
      let uniqueOptions = new Set();
      uniqueOptions.add(correctRadical); 
      
      let wrongPool = [item[3], item[4], item[5]];
      wrongPool.forEach(opt => uniqueOptions.add(opt));

      while(uniqueOptions.size < 4) {
        let randomChar = rawWordData[Math.floor(Math.random() * rawWordData.length)][2];
        uniqueOptions.add(randomChar);
      }

      const optionsArray = shuffleArray(Array.from(uniqueOptions));
      const answerIndex = optionsArray.indexOf(correctRadical);

      return {
        char: char,
        question: `「${char}」(${item[1]}) 的部首是？`,
        options: optionsArray,
        answerIndex: answerIndex,
        correctRadical: correctRadical,
        rationale: `「${char}」的部首是「${correctRadical}」部喔！`,
        userAnswer: null // 紀錄玩家選的答案
      };
    });

    document.getElementById('setup-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    
    currentQuestionIndex = 0;
    score = 0;
    totalSecondsElapsed = 0;
    document.getElementById('timer-display').textContent = `⏱️ 00:00`;
    
    startTimer();
    loadQuestion();
  }

  function loadQuestion() {
    const currentQuiz = quizData[currentQuestionIndex];
    document.getElementById('question-text').textContent = currentQuiz.question;
    document.getElementById('progress').textContent = `進度: ${currentQuestionIndex + 1} / ${totalQuestions}`;
    
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');

    optionsContainer.innerHTML = '';
    feedbackBox.className = 'feedback';
    feedbackBox.textContent = '';
    nextBtn.style.visibility = 'hidden';
    nextBtn.textContent = (currentQuestionIndex === totalQuestions - 1) ? '看成績 ➔' : '下一題 ➔';

    // 判斷是否顯示「上一題」按鈕
    prevBtn.style.display = currentQuestionIndex > 0 ? 'inline-block' : 'none';

    currentQuiz.options.forEach((option, index) => {
      const button = document.createElement('button');
      const zhuyin = zhuyinMap[option] || "";
      button.innerHTML = `<span>${option}</span>${zhuyin ? `<span class="zhuyin-text">${zhuyin}</span>` : ""}`;
      button.className = 'option-btn';
      
      // 如果這題之前已經作答過了，直接顯示結果不允許再點擊
      if (currentQuiz.userAnswer !== null) {
        button.disabled = true;
        if (index === currentQuiz.answerIndex) {
          button.classList.add('correct'); // 正確答案標記
        }
        if (index === currentQuiz.userAnswer && currentQuiz.userAnswer !== currentQuiz.answerIndex) {
          button.classList.add('wrong'); // 玩家選錯的標記
        }
      } else {
        button.onclick = () => selectAnswer(index, button);
      }
      
      optionsContainer.appendChild(button);
    });

    // 如果已經作答過，直接顯示回饋文字跟下一題按鈕
    if (currentQuiz.userAnswer !== null) {
      nextBtn.style.visibility = 'visible';
      const correctDisplay = currentQuiz.correctRadical + (zhuyinMap[currentQuiz.correctRadical] ? `(${zhuyinMap[currentQuiz.correctRadical]})` : "");
      if (currentQuiz.userAnswer === currentQuiz.answerIndex) {
        feedbackBox.textContent = '⭕ 此題您答對了！' + currentQuiz.rationale;
        feedbackBox.className = 'feedback show-correct';
      } else {
        feedbackBox.textContent = '❌ 此題您答錯了。正確答案是「' + correctDisplay + '」。' + currentQuiz.rationale;
        feedbackBox.className = 'feedback show-wrong';
      }
    }
  }

  function selectAnswer(selectedIndex, selectedButton) {
    const currentQuiz = quizData[currentQuestionIndex];
    const isCorrect = (selectedIndex === currentQuiz.answerIndex);
    const char = currentQuiz.char;
    const allButtons = document.querySelectorAll('.option-btn');

    // 紀錄玩家的答案 (避免上一題返回後可以無限刷分)
    currentQuiz.userAnswer = selectedIndex;

    playSound(isCorrect);
    allButtons.forEach(btn => btn.disabled = true);

    if (!userStats[char]) {
      userStats[char] = { correct: 0, wrong: 0 };
    }

    const feedbackBox = document.getElementById('feedback-box');

    if (isCorrect) {
      selectedButton.classList.add('correct');
      feedbackBox.textContent = '⭕ 答對了！' + currentQuiz.rationale;
      feedbackBox.className = 'feedback show-correct';
      userStats[char].correct++;
      score++;
    } else {
      const correctDisplay = currentQuiz.correctRadical + (zhuyinMap[currentQuiz.correctRadical] ? `(${zhuyinMap[currentQuiz.correctRadical]})` : "");
      selectedButton.classList.add('wrong');
      allButtons[currentQuiz.answerIndex].classList.add('correct');
      feedbackBox.textContent = '❌ 答錯了喔。正確答案是「' + correctDisplay + '」。' + currentQuiz.rationale;
      feedbackBox.className = 'feedback show-wrong';
      userStats[char].wrong++;
    }

    saveStats();
    document.getElementById('next-btn').style.visibility = 'visible';
  }

  // 返回上一題邏輯
  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      loadQuestion();
    }
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    stopTimer();
    document.getElementById('quiz-ui').style.display = 'none';
    const resultUi = document.getElementById('result-ui');
    resultUi.style.display = 'block';
    
    const summaryBox = document.getElementById('result-summary');
    const percentage = Math.round((score / totalQuestions) * 100);
    
    let titleHtml = '';
    if (percentage >= 80) {
      titleHtml = `<h2>🎉 測驗完成！太棒了！</h2>`;
    } else {
      titleHtml = `<h2>💪 測驗完成！繼續加油！</h2>`;
    }
    
    summaryBox.innerHTML = `${titleHtml}
      <div style="background:#f1f8e9; padding: 15px; border-radius: 10px; display:inline-block; margin-bottom: 10px;">
        <p style="font-size:1.3rem; margin:5px 0;">🎯 答對題數：<strong>${score} / ${totalQuestions}</strong> (${percentage}分)</p>
        <p style="font-size:1.1rem; margin:5px 0; color:#555;">⏱️ 總作答時間：<strong>${formatTime(totalSecondsElapsed)}</strong></p>
      </div>
    `;

    renderStatsTable();
  }

  function renderStatsTable() {
    const statsContainer = document.getElementById('stats-container');
    
    let html = `<h3>📊 個人學習統計 (依錯誤率排序)</h3>`;
    html += `<table class="stats-table">
              <tr>
                <th>單字</th>
                <th>正確次數</th>
                <th>錯誤次數</th>
                <th>正確率</th>
              </tr>`;

    const sortedStats = Object.keys(userStats).sort((a, b) => {
      const rateA = userStats[a].wrong / (userStats[a].correct + userStats[a].wrong || 1);
      const rateB = userStats[b].wrong / (userStats[b].correct + userStats[b].wrong || 1);
      return rateB - rateA;
    });

    sortedStats.forEach(char => {
      const data = userStats[char];
      const total = data.correct + data.wrong;
      const accRate = Math.round((data.correct / total) * 100);
      
      let rateClass = '';
      if (accRate < 60 && total > 0) rateClass = 'high-error';
      else if (accRate === 100) rateClass = 'perfect';

      html += `<tr>
                 <td style="font-size:1.2rem; font-weight:bold;">${char}</td>
                 <td>${data.correct}</td>
                 <td class="${data.wrong > 0 ? 'high-error' : ''}">${data.wrong}</td>
                 <td class="${rateClass}">${accRate}%</td>
               </tr>`;
    });

    html += `</table>`;
    statsContainer.innerHTML = html;
  }
</script>
