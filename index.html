<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f9f2">
<title>智慧學習 × 大樂透歡樂猜獎</title>
<style>
  * { box-sizing: border-box; }
  body {
    display: grid;
    min-height: 100vh;
    margin: 0;
    padding: 30px 18px;
    place-items: center;
    color: #34413b;
    background:
      radial-gradient(circle at 8% 8%, rgba(255, 225, 147, .55), transparent 22rem),
      radial-gradient(circle at 94% 92%, rgba(151, 211, 178, .4), transparent 25rem),
      #f5f9f2;
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .home {
    width: min(100%, 1000px);
    padding: clamp(24px, 6vw, 60px);
    border: 1px solid rgba(55, 92, 70, .08);
    border-radius: 34px;
    background: rgba(255, 255, 255, .93);
    box-shadow: 0 24px 70px rgba(57, 82, 62, .12);
    text-align: center;
  }
  .eyebrow {
    margin: 0 0 12px;
    color: #778a7b;
    font-size: .88rem;
    font-weight: 800;
    letter-spacing: .16em;
  }
  h1 {
    margin: 0;
    color: #286c59;
    font-size: clamp(2rem, 6vw, 3.1rem);
    line-height: 1.2;
  }
  .intro {
    margin: 15px 0 34px;
    color: #68776e;
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    line-height: 1.7;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    text-align: left;
  }
  .choice {
    position: relative;
    display: flex;
    min-height: 280px;
    flex-direction: column;
    align-items: flex-start;
    overflow: hidden;
    padding: clamp(24px, 4vw, 36px);
    border: 3px solid transparent;
    border-radius: 27px;
    color: inherit;
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .choice:hover, .choice:focus-visible {
    transform: translateY(-5px);
    box-shadow: 0 14px 28px rgba(47, 65, 53, .13);
  }
  .choice:focus-visible { outline: 3px solid #286c59; outline-offset: 4px; }
  .choice-learning { border-color: #d7edcf; background: linear-gradient(145deg, #f4ffef, #e3f4df); }
  .choice-lotto { border-color: #ffe2b8; background: linear-gradient(145deg, #fff9ed, #ffedcf); }
  .choice-icon {
    display: grid;
    width: 76px;
    height: 76px;
    margin-bottom: 25px;
    place-items: center;
    border-radius: 23px;
    font-size: 2.8rem;
  }
  .choice-learning .choice-icon { background: #d4efcb; }
  .choice-lotto .choice-icon { background: #ffe0ac; }
  .choice h2 { margin: 0 0 10px; font-size: clamp(1.45rem, 3.2vw, 1.9rem); }
  .choice p { margin: 0; color: #66736b; line-height: 1.65; }
  .choice-action {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding-top: 25px;
    font-weight: 850;
  }
  .choice-learning .choice-action { color: #286c59; }
  .choice-lotto .choice-action { color: #a65c12; }
  .footer { margin: 26px 0 0; color: #8a958d; font-size: .85rem; }
  @media (max-width: 640px) {
    .home { border-radius: 25px; }
    .choices { grid-template-columns: 1fr; }
    .choice { min-height: 230px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="home">
  <p class="eyebrow">歡迎來到歡樂探索小天地</p>
  <h1>今天想玩什麼？</h1>
  <p class="intro">選擇一個入口，開始今天的學習或歡樂猜獎時光。</p>
  <nav class="choices" aria-label="主要功能">
    <a class="choice choice-learning" href="learning.html">
      <span class="choice-icon" aria-hidden="true">📚</span>
      <h2>智慧學習樂園</h2>
      <p>部首、數學、筆畫、注音、造句與期中期末練習，一起來挑戰！</p>
      <span class="choice-action">進入學習樂園 <span aria-hidden="true">→</span></span>
    </a>
    <a class="choice choice-lotto" href="lotto.html">
      <span class="choice-icon" aria-hidden="true">🎯</span>
      <h2>樂透歡樂猜獎遊戲</h2>
      <p>玩大樂透或威力彩，依歷史資料與中位數篩選，產生隨機參考號碼。</p>
      <span class="choice-action">開始歡樂猜獎 <span aria-hidden="true">→</span></span>
    </a>
  </nav>
  <p class="footer">學習與遊戲都要保持好奇，也記得理性娛樂。</p>
</main>
</body>
</html>
