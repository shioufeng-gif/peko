<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國字筆畫練習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  /* 複用相同 CSS 樣式 ... */
  body { font-family: 'Segoe UI', 'Microsoft JhengHei'; background: linear-gradient(135deg, #e1f5fe 0%, #fff9c4 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
  .quiz-container { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
  .question-box { background-color: #e3f2fd; padding: 25px; border-radius: 15px; margin-bottom: 20px; font-size: 3rem; font-weight: bold; border: 3px dashed #2196f3; }
  .info-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #555; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .option-btn { background-color: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; font-size: 1.8rem; cursor: pointer; transition: all 0.2s; font-weight: bold; }
  .option-btn.correct { background-color: #c8e6c9; border-color: #4caf50; }
  .option-btn.wrong { background-color: #ffcdd2; border-color: #f44336; }
  .btn { color: white; border: none; padding: 15px; font-size: 1.2rem; border-radius: 25px; cursor: pointer; font-weight: bold; }
  .btn-primary { background-color: #2196f3; }
  .btn-home { background-color: #00bcd4; margin-top: 10px; }
  /* 連續答對動畫樣式 */
  .streak-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 2000;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    opacity: 0;
  }
  .streak-overlay.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .streak-pikmin { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce 0.8s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
  .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>✍️ 國字筆畫大挑戰 ✍️</h1>
  <div id="portal-ui">
    <p style="font-weight: bold; font-size: 1.2rem;">請選擇挑戰難度</p>
    <button class="btn btn-primary" onclick="initQuiz('easy')" style="width: 80%; background-color: #4caf50; margin-bottom: 10px;">🟢 簡易 (10題 / 1-5畫)</button>
    <button class="btn btn-primary" onclick="initQuiz('medium')" style="width: 80%; background-color: #ff9800; margin-bottom: 10px;">🟡 中等 (20題 / 6-10畫)</button>
    <button class="btn btn-primary" onclick="initQuiz('hard')" style="width: 80%; background-color: #f44336; margin-bottom: 10px;">🔴 困難 (50題 / 綜合)</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 80%;">返回大廳</button>
  </div>
  <div id="quiz-ui" style="display:none">
    <div class="info-bar">
      <span id="progress"></span>
      <span id="timer-display">⏱️ 00:00</span>
    </div>
    <div class="question-box" id="question-text"></div>
    <p>請問這個字總共有幾畫？</p>
    <div class="options-grid" id="options-container"></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-home" onclick="location.href='index.html'" style="flex: 1;">🏠 首頁</button>
      <button class="btn btn-primary" id="next-btn" style="visibility:hidden; flex: 2;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>
  <div id="result-ui" style="display:none">
    <h2>完成挑戰！</h2>
    <div id="result-summary" style="font-size: 1.2rem; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;"></div>
    <button class="btn btn-primary" onclick="location.reload()" style="width: 100%;">再試一次</button>
    <button class="btn btn-home" onclick="location.href='index.html'" style="width: 100%;">返回大廳</button>
    <div id="stats-container" style="max-height: 250px; overflow-y: auto; margin-top: 20px;"></div>
  </div>
</div>

<!-- 連續答對 3 題的動畫彈窗 -->
<div id="streak-animation" class="streak-overlay">
  <div class="streak-pikmin"><i class="fas fa-seedling"></i></div>
  <div style="font-size: 1.5rem; font-weight: bold; color: #00796b;">太棒了！<br>連續答對 3 題！</div>
  <div style="font-size: 1.2rem; margin-top: 10px; color: #2196f3;">🌟 皮克敏為你加油 🌟</div>
</div>

<script>
  const raw = [
    ["一", "1"], ["乙", "1"], ["了", "2"], ["二", "2"], ["人", "2"], ["入", "2"], ["八", "2"], ["又", "2"], 
    ["三", "3"], ["大", "3"], ["上", "3"], ["下", "3"], ["口", "3"], ["土", "3"], ["子", "3"], ["小", "3"], ["山", "3"], ["工", "3"], ["也", "3"],
    ["不", "4"], ["中", "4"], ["五", "4"], ["六", "4"], ["內", "4"], ["木", "4"], ["火", "4"], ["水", "4"], ["月", "4"], ["日", "4"], ["手", "4"], ["牛", "4"], ["方", "4"], ["王", "4"], ["天", "4"], ["心", "4"], ["少", "4"],
    ["生", "5"], ["以", "5"], ["用", "5"], ["出", "5"], ["他", "5"], ["去", "5"], ["外", "5"], ["句", "5"], ["左", "5"], ["右", "5"],
    ["在", "6"], ["有", "6"], ["好", "6"], ["多", "6"], ["她", "6"], ["回", "6"], ["地", "6"], ["自", "6"], ["年", "6"],
    ["我", "7"], ["你", "7"], ["沒", "7"], ["吧", "7"], ["花", "7"], ["走", "7"], ["車", "7"], ["里", "7"],
    ["的", "8"], ["和", "8"], ["呢", "8"], ["門", "8"], ["雨", "8"], ["林", "8"], ["長", "8"],
    ["是", "9"], ["為", "9"], ["風", "9"], ["春", "9"], ["要", "9"], ["草", "9"],
    ["們", "10"], ["個", "10"], ["校", "10"], ["馬", "10"], ["家", "10"],
    ["國", "11"], ["這", "11"], ["鳥", "11"], ["康", "11"], ["問", "11"],
    ["進", "12"], ["喜", "12"], ["黃", "12"], ["就", "12"],
    ["嗎", "13"], ["道", "13"], ["愛", "13"],
    ["說", "14"], ["語", "14"], ["種", "14"],
    ["學", "16"], ["辦", "16"], ["親", "16"]
  ];

  let quizData = [];
  let currentIdx = 0;
  let score = 0;
  let startTime, timerInterval;
  let streakCounter = 0;
  let missedQuestions = [];
  let restReminderShown = false;
  let userStats = JSON.parse(localStorage.getItem('strokeStats')) || {};
  function saveStats() { localStorage.setItem('strokeStats', JSON.stringify(userStats)); }

  function speakEncouragement(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = text === 'good job' ? 'en-US' : 'zh-TW';
    window.speechSynthesis.speak(utterance);
  }

  function showStreakAnimation() {
    const anim = document.getElementById('streak-animation');
    const pikminIcon = anim.querySelector('.streak-pikmin i');
    const colors = ['#ff5252', '#448aff', '#ffd740', '#9c27b0', '#4caf50'];
    pikminIcon.style.color = colors[Math.floor(Math.random() * colors.length)];
    anim.classList.add('show');
    setTimeout(() => {
      anim.classList.remove('show');
    }, 2000);
  }

  function initQuiz(difficulty) {
    document.getElementById('portal-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    restReminderShown = false;
    streakCounter = 0;
    missedQuestions = [];
    
    let count = difficulty === 'easy' ? 10 : difficulty === 'medium' ? 20 : 50;
    let filtered = raw;
    if(difficulty === 'easy') filtered = raw.filter(i => parseInt(i[1]) <= 5);
    else if(difficulty === 'medium') filtered = raw.filter(i => parseInt(i[1]) > 5 && parseInt(i[1]) <= 10);

    quizData = filtered.sort(() => Math.random() - 0.5).slice(0, count);
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function retryMissed() {
    quizData = [...missedQuestions].sort(() => Math.random() - 0.5);
    missedQuestions = [];
    streakCounter = 0;
    score = 0;
    currentIdx = 0;
    restReminderShown = false;
    document.getElementById('result-ui').style.display = 'none';
    document.getElementById('quiz-ui').style.display = 'block';
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
  }

  function updateTimer() {
    let elapsed = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    let s = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').textContent = `⏱️ ${m}:${s}`;

    if (elapsed >= 1200 && !restReminderShown) {
      restReminderShown = true;
      alert("小朋友，你已經練習 20 分鐘囉！休息一下眼睛吧！");
    }
  }

  function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById('question-text').textContent = q[0];
    document.getElementById('progress').textContent = `進度: ${currentIdx + 1} / ${quizData.length}`;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('next-btn').style.visibility = 'hidden';
    let ans = parseInt(q[1]);

    // 確保生成 4 個不重複的選項
    let optionsSet = new Set([ans]);
    while (optionsSet.size < 4) {
      let offset = Math.floor(Math.random() * 7) - 3; // -3 到 3 的偏離值
      let fake = ans + offset;
      if (fake > 0 && fake !== ans) optionsSet.add(fake);
    }

    let opts = Array.from(optionsSet).sort(() => Math.random() - 0.5);
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = `${opt} 畫`;
      btn.onclick = () => {
        if (document.getElementById('next-btn').style.visibility === 'visible') return;
        if (!userStats[q[0]]) userStats[q[0]] = { correct: 0, wrong: 0 };

        if (opt === ans) { 
          btn.classList.add('correct'); 
          score++; 
          streakCounter++;
          userStats[q[0]].correct++;
          if (score === 3) speakEncouragement("你很棒");
          else if (score === 5) speakEncouragement("做的好");
          if (streakCounter > 0 && streakCounter % 3 === 0) showStreakAnimation();
        } else {
          btn.classList.add('wrong');
          streakCounter = 0;
          missedQuestions.push(q);
          userStats[q[0]].wrong++;
        }
        saveStats();
        document.getElementById('next-btn').style.visibility = 'visible';
      };
      container.appendChild(btn);
    });
  }
  function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) loadQuestion();
    else {
      clearInterval(timerInterval);
      if (score === quizData.length && quizData.length > 0) speakEncouragement("good job");
      let elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('quiz-ui').style.display = 'none';
      document.getElementById('result-ui').style.display = 'block';
      document.getElementById('result-summary').innerHTML = `
        <p>🎯 答對：<b>${score} / ${quizData.length}</b></p>
        <p>⏱️ 用時：<b>${Math.floor(elapsed/60)}分${elapsed%60}秒</b></p>
        <p>📈 正確率：<b>${Math.round(score/quizData.length*100)}%</b></p>
      `;

      if (missedQuestions.length > 0) {
        document.getElementById('result-summary').innerHTML += `
          <button class="btn btn-primary" onclick="retryMissed()" style="background-color: #f44336; margin-top: 15px; width: 100%; box-shadow: 0 6px 0 #b71c1c;">🎯 挑戰錯題特訓 (${missedQuestions.length}題)</button>
        `;
      }
      renderStatsTable();
    }
  }

  function renderStatsTable() {
    const statsContainer = document.getElementById('stats-container');
    let html = `<h3>📊 學習統計 (錯誤率排序)</h3><table class="stats-table"><tr><th>題目</th><th>對/錯</th><th>正確率</th></tr>`;
    
    const sorted = Object.keys(userStats).sort((a, b) => {
      const rateA = userStats[a].wrong / (userStats[a].correct + userStats[a].wrong || 1);
      const rateB = userStats[b].wrong / (userStats[b].correct + userStats[b].wrong || 1);
      return rateB - rateA;
    });

    sorted.forEach(key => {
      const d = userStats[key];
      const total = d.correct + d.wrong;
      const acc = Math.round((d.correct / total) * 100);
      html += `<tr>
        <td style="font-size:1.1rem; font-weight:bold;">${key}</td>
        <td>${d.correct} / <span style="color:red">${d.wrong}</span></td>
        <td>${acc}%</td>
      </tr>`;
    });
    html += `</table>`;
    statsContainer.innerHTML = html;
  }
</script>
</body>
</html>
